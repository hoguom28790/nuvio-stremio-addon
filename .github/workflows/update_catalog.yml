name: Auto Update JavHD Catalog

on:
  schedule:
    - cron: '0 */6 * * *'  # Tự động chạy định kỳ mỗi 6 tiếng
  workflow_dispatch:       # Cho phép bấm nút "Run workflow" để chạy ngay lập tức

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JavHD Catalog Updater
        run: node scripts/update_javhd.js

      - name: Commit and push if changes detected
        run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@users.noreply.github.com"
         git add src/data/javhd_catalog.json
         if git diff --staged --quiet; then
           echo "No changes to commit."
         else
           git commit -m "chore(catalog): auto update JavHD catalog [skip ci]"
           git push origin master
         fi
